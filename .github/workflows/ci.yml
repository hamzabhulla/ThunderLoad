name: ThunderLoad CI
on:
  push:
    branches: [main]
    paths: ["thunderload/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["thunderload/**", ".github/workflows/ci.yml"]
permissions:
  contents: read
jobs:
  windows-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: thunderload -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate extension
        shell: pwsh
        run: |
          $checks = @(
            "thunderload/extension/background.js",
            "thunderload/extension/content.js",
            "thunderload/extension/hook.js",
            "thunderload/extension/popup.js"
          )
          foreach ($file in $checks) {
            node --check $file
            if ($LASTEXITCODE -ne 0) {
              throw "JavaScript syntax validation failed: $file"
            }
          }
          node thunderload/scripts/validate-extension.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Extension manifest validation failed"
          }
      - name: Package browser extensions
        # Must run before ANY cargo command touches the desktop crate: the
        # Tauri build script (tauri-build) validates the bundled resource
        # files (see tauri.conf.json) whenever it runs — including during
        # cargo check / cargo test, not only at installer build time. The
        # packager only needs the extension sources, so it can run first.
        shell: pwsh
        run: .\thunderload\scripts\package-extensions.ps1
      - name: Build native host required by Tauri resources
        working-directory: thunderload
        run: cargo build --release -p thunderload-host
      - name: Check Rust workspace
        working-directory: thunderload
        run: cargo check --workspace
      - name: Test Rust workspace
        working-directory: thunderload
        run: cargo test --workspace
      - name: Install desktop dependencies
        working-directory: thunderload/desktop
        run: npm install
      - name: Build desktop frontend
        working-directory: thunderload/desktop
        run: npm run build
      - name: Build Windows NSIS installer
        working-directory: thunderload/desktop
        run: npm run tauri -- build
      - name: Upload preview build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ThunderLoad-preview-${{ github.sha }}
          path: |
            thunderload/target/release/bundle/nsis/*.exe
            thunderload/target/release/thunderload-host.exe
            thunderload/dist/extensions/*.zip
            thunderload/dist/extensions/*.xpi
          if-no-files-found: error
          retention-days: 14

  linux-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: thunderload -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Validate extension
        run: |
          node --check thunderload/extension/background.js
          node --check thunderload/extension/content.js
          node --check thunderload/extension/hook.js
          node --check thunderload/extension/popup.js
          node thunderload/scripts/validate-extension.mjs
      - name: Package browser extensions
        # Same packages as the Windows PowerShell step, via the
        # cross-platform Node packager (same contents and layout).
        run: node thunderload/scripts/package-extensions.mjs
      - name: Build native host required by Tauri resources
        working-directory: thunderload
        run: |
          cargo build --release -p thunderload-host
          # The Tauri resource entry is named thunderload-host.exe (the
          # Windows binary name); on Linux the built binary has no
          # extension, so copy it to the expected resource name. The
          # desktop copies it back out as `thunderload-host` at
          # registration time.
          cp target/release/thunderload-host target/release/thunderload-host.exe
      - name: Check Rust workspace
        working-directory: thunderload
        run: cargo check --workspace
      - name: Test Rust workspace
        working-directory: thunderload
        run: cargo test --workspace
      - name: Install desktop dependencies
        working-directory: thunderload/desktop
        run: npm install
      - name: Build desktop frontend
        working-directory: thunderload/desktop
        run: npm run build
      - name: Build Linux packages
        working-directory: thunderload/desktop
        run: npm run tauri -- build
      - name: Upload preview build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ThunderLoad-preview-linux-${{ github.sha }}
          path: |
            thunderload/target/release/bundle/deb/*.deb
            thunderload/target/release/bundle/appimage/*.AppImage
            thunderload/target/release/thunderload-host
            thunderload/dist/extensions/*.zip
            thunderload/dist/extensions/*.xpi
          if-no-files-found: error
          retention-days: 14

  macos-checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: thunderload -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate extension
        run: |
          node --check thunderload/extension/background.js
          node --check thunderload/extension/content.js
          node --check thunderload/extension/hook.js
          node --check thunderload/extension/popup.js
          node thunderload/scripts/validate-extension.mjs
      - name: Package browser extensions
        run: node thunderload/scripts/package-extensions.mjs
      - name: Build native host required by Tauri resources
        working-directory: thunderload
        run: |
          cargo build --release -p thunderload-host
          # Same resource-name copy as the Linux job: the Tauri resource
          # entry is named thunderload-host.exe, the macOS binary has no
          # extension.
          cp target/release/thunderload-host target/release/thunderload-host.exe
      - name: Check Rust workspace
        working-directory: thunderload
        run: cargo check --workspace
      - name: Test Rust workspace
        working-directory: thunderload
        run: cargo test --workspace
      - name: Install desktop dependencies
        working-directory: thunderload/desktop
        run: npm install
      - name: Build desktop frontend
        working-directory: thunderload/desktop
        run: npm run build
      - name: Build macOS package
        working-directory: thunderload/desktop
        run: npm run tauri -- build
      - name: Upload preview build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ThunderLoad-preview-macos-${{ github.sha }}
          path: |
            thunderload/target/release/bundle/dmg/*.dmg
            thunderload/target/release/thunderload-host
            thunderload/dist/extensions/*.zip
            thunderload/dist/extensions/*.xpi
          if-no-files-found: error
          retention-days: 14
