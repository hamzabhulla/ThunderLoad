<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ThunderLoad</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">↯</span><strong>ThunderLoad</strong></div>
      <button class="secondary" id="rescanBtn">Rescan</button>
    </header>
    <div id="sourceList" class="source-list"><div class="empty">Looking for media…</div></div>
    <footer class="footer">
      <label class="toggle-row" for="interceptToggle"><span>Browser downloads</span><span class="switch"><input type="checkbox" id="interceptToggle" checked /><span class="slider" aria-hidden="true"></span></span></label>
    </footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
