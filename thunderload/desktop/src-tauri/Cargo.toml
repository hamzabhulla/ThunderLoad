[package]
name = "thunderload-desktop"
version = "0.3.4"
description = "ThunderLoad desktop download manager"
authors = ["ThunderLoad contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
thunderload-engine = { path = "../../engine" }
tokio = { version = "1", features = ["sync", "fs", "process", "time"] }
uuid = { version = "1", features = ["v4"] }
