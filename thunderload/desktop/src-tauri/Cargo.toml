[package]
name = "thunderload-desktop"
version = "0.2.0"
description = "ThunderLoad desktop download manager"
authors = ["ThunderLoad contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thunderload-engine = { path = "../../engine" }
tokio = { version = "1", features = ["sync", "fs"] }
uuid = { version = "1", features = ["v4"] }
