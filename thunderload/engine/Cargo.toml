[package]
name = "thunderload-engine"
version = "0.3.5"
edition = "2021"

[dependencies]
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "net", "rt-multi-thread", "sync", "time", "process"] }
url = "2"
quick-xml = "0.38.4"
uuid = { version = "1", features = ["v4"] }
